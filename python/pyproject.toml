[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interfaze-langchain"
version = "1.0.0"
description = "Interfaze Langchain SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "InterfazeAI" }]
keywords = ["interfaze", "langchain", "ai", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = [
  "interfaze>=1.0.3,<2",
  "langchain-openai>=1.4.1,<2",
  "langchain-core>=1.0,<2",
  "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://interfaze.ai"
Repository = "https://github.com/InterfazeAI/langchain-interfaze"

[dependency-groups]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-socket==0.8.0",
  "langchain-tests==1.1.9",
  "respx==0.23.1",
  "pytest-cov==7.1.0",
]
test_integration = []
lint = ["ruff==0.16.0"]
typing = ["mypy==2.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["interfaze_langchain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit_tests"]
addopts = ""
filterwarnings = [
  "error",
  'ignore:Pydantic serializer warnings:UserWarning',
]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.12"
strict = true
files = ["interfaze_langchain", "scripts"]

[[tool.mypy.overrides]]
module = ["langchain_openai.*", "langchain_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["interfaze_langchain.chat_models"]
disallow_subclassing_any = false
warn_return_any = false
