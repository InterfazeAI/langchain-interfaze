name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Five files carry the version and two of them reach users as a User-Agent. A release
  # cut from the wrong commit would otherwise publish the previous version, silently.
  verify:
    name: verify (versions match the tag · tests pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Versions match the release tag
        run: node scripts/check-versions.mjs "$GITHUB_REF_NAME"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Python tests
        working-directory: python
        run: uv run --all-groups pytest tests/unit_tests/ --disable-socket --allow-unix-socket
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: JS tests
        working-directory: js
        run: npm ci && npm test

  build:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: uv build
      - name: Verify metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: python/dist/

  testpypi:
    needs: build
    if: github.event.release.prerelease == true
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/langchain-interfaze
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-interfaze
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm-publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm run check:pkg
      - run: npm publish --provenance --access public

  jsr-publish:
    name: Publish to JSR
    needs: build
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - run: npm ci
      - run: npx jsr publish --allow-slow-types
